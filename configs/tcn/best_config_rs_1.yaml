run_name: root_tcn_random_search_v2_trial_001_delta_mode_pitch_points
seed: 1235
device: auto
prediction_mode: delta  # absolute | delta ; delta => root_pred_norm = root_init_norm + delta_pred_norm
root_init_dir: auto         # auto -> data/root_init_cam_normalized
data_dir: data/features_normalized  # dossier de features normalisées utilisé pour le training
output_dir: outputs
input_config:
  use_x3d_sam_rel: true
  use_x2d_img: true
  use_x2d_box: true
  use_pitch_points_2d: true # 50 points terrain projetes + masque de visibilite
  use_bbox_feat: true
  bbox_clean_or_noisy: clean
  use_cam_feat: true
  cam_feat_type: boosted_clean
  use_ground_intersection: true
  use_valid_joints_as_input: true
dataset:
  max_sequences: null
  max_windows_per_sequence: null
  window_size: 41
  stride: 8
  min_valid_ratio: 0.5
  pad_mode: edge
  min_in_image_joints_ratio: 1
  min_bbox_width_px: 12
  min_bbox_height_px: 8
  min_bbox_margin_px: 15
model:
  encoder_hidden_dims:
  - 192
  - 192
  temporal_hidden_dim: 192
  temporal_dilations:
  - 1
  - 2
  - 4
  - 8
  - 16
  temporal_kernel_size: 3
  activation: gelu
  dropout: 0.14039
  head_hidden_dims:
  - 128
optimizer:
  lr: 0.00016788303
  weight_decay: 0.00032000921
training:
  batch_size: 64
  epochs: 60
  num_workers: 2
  group_batches_by_sequence: true
  grad_clip_norm: 1.0
  early_stopping_patience: 10
loss_weights:
  root: 1.0
  root_axis_weights:
  - 1.033
  - 1.088
  - 1.271
  root_vel: 0.10003676
  root_acc: 0.019068171
  cam3d: 0.0
  proj: 0.0
eval:
  splits:
  - valid
  - test
  batch_size: 64
  num_workers: 2
  save_predictions_npz: true
  save_predictions_csv: true
  aggregate_overlaps: mean
plots:
  enabled: true
  split_for_plots: valid
  seq_name: null
  person_idx: null
  num_frames_overlay: 6
  show_sam2d_overlay: false
  num_players_per_subplot: null
diagnostic_plots:
  enabled: true
  split_for_plots: valid
  root_error_vs_camera_distance: true
  root_error_vs_image_center_distance: true
  root_error_vs_player_speed: true
  speed_window: 5
