# Root translation refinement — V1 (frame-wise MLP)
# Notes:
# - choisir ici le dossier normalisé utilisé pour le training
# - outputs go to `output_dir/<subfolders>/<run_name>/...`

run_name: root_mlp_v1_train
seed: 123

device: auto  # auto | cpu | cuda

prediction_mode: absolute  # absolute | delta ; delta => root_pred_norm = root_init_norm + delta_pred_norm
root_init_dir: auto         # auto -> data/root_init_cam_normalized

data_dir: data/features_normalized  # ex: data/features_normalized_wo_k
output_dir: outputs

input_config:
  use_x3d_sam_rel: true
  use_x2d_img: true
  use_x2d_box: true
  use_pitch_points_2d: true       # 50 points terrain projetes + masque de visibilite
  use_bbox_feat: true
  bbox_clean_or_noisy: clean         # clean | noisy
  use_cam_feat: true
  cam_feat_type: boosted_clean       # base_clean | base_noisy | boosted_clean | boosted_noisy
  use_ground_intersection: false     # ajoute ground_intersection normalisé (3D monde) à l'entrée
  use_valid_joints_as_input: true # indique pour chaque joint s'il est valide dans la frame. 

dataset:
  # Debug helpers (optional)
  max_sequences: null                   # null for full split, en mode debug : 2 
  max_samples_per_sequence: null     # null for full (1 sample = une frame d'un joueur), en mode debug : 2000
  subsample_stride: 1                # >=1 on prend 1 frame sur subsample_stride, 1 pour pas de subsampling
  # Filtering (optional): fraction of valid joints whose 2D GT lies inside the image
  # Helps remove off-frame players that can cause degenerate bbox-normalized inputs.
  min_in_image_joints_ratio: 0.9    # e.g. 0.5, null to disable
  min_bbox_margin_px: null          # reject boxes closer than N px to image border, e.g. 10 or 20

model:
  hidden_dims: [256, 256, 128]
  activation: gelu                   # relu | gelu
  dropout: 0.1

optimizer:
  lr: 1.0e-3
  weight_decay: 1.0e-4

training:
  batch_size: 512
  epochs: 30
  num_workers: 2 # nombre de workers (chargement CPU/GPU) pour le dataloader d'évaluation
  group_batches_by_sequence: true # important pour ne pas faire de io très couteux en temps de run 
  grad_clip_norm: 1.0                # null to disable
  early_stopping_patience: 10

loss_weights:
  root: 1.0 # laisser 1, ce qu'on apprend vraiment
  root_axis_weights: [1.0, 1.0, 1.0] # x, y, z; augmenter z pour pondérer la profondeur
  #smooth L1 entre la root prédite et la root GT
  cam3d: 0 # entre 0.1 et 1 
  # smooth L1 entre la cam3d prédite et la cam3d GT (pour aider à apprendre une meilleure représentation interne)
  #pondérée par les masks, les joints qui ne sont pas visibles ne contribuent pas à la loss. 
  proj: 0 # sensible (pixel), entre 0.01 et 0.1
  # smooth L1 entre les projections 2D des joints rootés (avec la root GT) et les projections 2D des joints rootés (avec la root prédite). 
  #pondérée par les masks

eval:
  splits: [valid, test]
  batch_size: 1024
  num_workers: 2 # nombre de workers (chargement CPU/GPU) pour le dataloader d'évaluation
  save_predictions_npz: true
  save_predictions_csv: true

plots:
  enabled: true
  split_for_plots: valid
  seq_name: null #nom explicite de la sequence (ARG_CRO_220001 par exemple)
  # si null : le code choisit la fréquence la plus visible
  person_idx: null # index du joueur dans la sequence
  # si null : le code choisit le joueur le plus visible dans la sequence
  num_frames_overlay: 6
  show_sam2d_overlay: false # afficher/masquer la 2D de SAM3Dbody
  num_players_per_subplot: null # null = tous les joueurs visibles; sinon nombre max de joueurs par subplot
