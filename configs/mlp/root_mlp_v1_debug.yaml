# Root translation refinement — V1 (frame-wise MLP)
# Notes:
# - `data_dir: auto` -> ps.DATA_DIR / "features_normalized"
# - outputs go to `output_dir/<subfolders>/<run_name>/...`

run_name: root_mlp_v1_debug_test2
seed: 123

device: auto  # auto | cpu | cuda

prediction_mode: absolute  # absolute | delta ; delta => root_pred_norm = root_init_norm + delta_pred_norm
root_init_dir: auto         # auto -> data/root_init_cam_normalized

data_dir: auto
output_dir: outputs

input_config:
  use_x3d_sam_rel: true
  use_x2d_img: true
  use_x2d_box: true
  use_bbox_feat: true
  bbox_clean_or_noisy: noisy         # clean | noisy
  use_cam_feat: true
  cam_feat_type: boosted_clean       # base_clean | base_noisy | boosted_clean | boosted_noisy
  use_ground_intersection: false
  use_valid_joints_as_input: true

dataset:
  # Debug helpers (optional)
  max_sequences: 2                   # null for full split
  max_samples_per_sequence: 2000     # null for full (1 sample = une frame d'un joueur)
  subsample_stride: 1                # >=1 on prend 1 frame sur subsample_stride, 1 pour pas de subsampling
  # Filtering (optional): fraction of valid joints whose 2D GT lies inside the image
  # Helps remove off-frame players that can cause degenerate bbox-normalized inputs.
  min_in_image_joints_ratio: 0.9     # null to disable
  min_bbox_margin_px: null           # reject boxes closer than N px to image border, e.g. 10 or 20

model:
  hidden_dims: [256, 256, 128]
  activation: gelu                   # relu | gelu
  dropout: 0.1

optimizer:
  lr: 1.0e-3
  weight_decay: 1.0e-4

training:
  batch_size: 512
  epochs: 30
  num_workers: 4
  grad_clip_norm: 1.0                # null to disable
  early_stopping_patience: 10

loss_weights:
  root: 1.0
  root_axis_weights: [1.0, 1.0, 1.0] # x, y, z; increase z to emphasize depth.
  cam3d: 0.0
  proj: 0.0

eval:
  splits: [valid, test]
  batch_size: 1024
  num_workers: 4
  save_predictions_npz: true
  save_predictions_csv: true

plots:
  enabled: true
  split_for_plots: valid
  seq_name: null
  person_idx: null
  num_frames_overlay: 6
  show_sam2d_overlay: true
  num_players_per_subplot: null
