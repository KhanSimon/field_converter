run_name: root_transformer_random_search_base
seed: 1235
device: auto
prediction_mode: delta
root_init_dir: data/ablation/unseen_match_v1/primary/root_init_cam_normalized
data_dir: data/ablation/unseen_match_v1/primary/features_normalized
output_dir: outputs/ablation/unseen_match_v1

input_config:
  use_x3d_sam_rel: true
  use_x2d_img: true
  use_x2d_box: true
  use_pitch_points_2d: false
  use_bbox_feat: true
  bbox_clean_or_noisy: clean
  use_cam_feat: true
  cam_feat_type: boosted_clean
  use_ground_intersection: false
  use_root_init_as_input: false
  use_valid_joints_as_input: false

dataset:
  max_sequences: null
  max_windows_per_sequence: null
  window_size: 41
  stride: 8
  min_valid_ratio: 0.5
  pad_mode: edge
  min_in_image_joints_ratio: 1.0
  min_bbox_width_px: 12
  min_bbox_height_px: 8
  min_bbox_margin_px: 15

model:
  encoder_hidden_dims: [256]
  d_model: 256
  num_layers: 2
  num_heads: 4
  dim_feedforward: 512
  dropout: 0.1
  activation: gelu
  positional_encoding: learned
  max_window_size: 41
  norm_first: true
  head_hidden_dims: [128]

optimizer:
  lr: 0.00016788303
  weight_decay: 0.00032000921

training:
  batch_size: 64
  epochs: 60
  num_workers: 2
  group_batches_by_sequence: true
  grad_clip_norm: 1.0
  early_stopping_patience: 10

loss_weights:
  root: 1.0
  root_axis_weights: [1.0, 1.0, 1.7]
  root_vel: 0.10003676
  root_acc: 0.019068171
  cam3d: 0.3
  proj: 0.0

eval:
  splits: [valid, test]
  batch_size: 64
  num_workers: 2
  save_predictions_npz: true
  save_predictions_csv: false
  aggregate_overlaps: mean

plots:
  enabled: false
  split_for_plots: valid
  root_error_ground_vs_air_histogram: false
  seq_name: null
  person_idx: null
  num_frames_overlay: 6
  show_sam2d_overlay: false
  num_players_per_subplot: null
