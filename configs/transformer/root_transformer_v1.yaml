run_name: root_transformer_v1_delta_new_root_init
seed: 123
device: auto
prediction_mode: delta  # absolute | delta ; delta => root_pred_norm = root_init_norm + delta_pred_norm
root_init_dir: auto         # auto -> data/root_init_cam_normalized
data_dir: auto
output_dir: outputs

input_config:
  use_x3d_sam_rel: true
  use_x2d_img: true
  use_x2d_box: true
  use_pitch_points_2d: true # 50 points terrain projetes + masque de visibilite
  use_bbox_feat: true
  bbox_clean_or_noisy: clean
  use_cam_feat: true
  cam_feat_type: boosted_clean
  use_ground_intersection: true
  use_valid_joints_as_input: true

dataset:
  max_sequences: null
  max_windows_per_sequence: null
  window_size: 201
  stride: 20 #nb de frames entre le début de 2 fenêtres consécutives. Avec window_size=81 et stride=20, on a un recouvrement de 61 frames entre les fenêtres, ce qui permet de mieux capturer la continuité du mouvement.
  min_valid_ratio: 0.5
  pad_mode: edge #comment gérer les extrémités de la window (extrémité gauche pour le début, 1ères frames et extrémité droite pour la fin, dernières frames).
    #edge : on étire le bord : [0, 1, 2, 3, 4]->[3, 4, 4, 4, 4]
    #zero : on remplit le bord de vecteur null : [0, 1, 2, 3, 4]->[0, 0, 0, 1, 2]
    # : on reflècte la séquence : [0, 1, 2, 3, 4]->[2, 1, 0, 1, 2] (pas réaliste pour du mouvement human)
    #none : pas de padding du tout (on perd des données)
  min_in_image_joints_ratio: 1
  min_bbox_width_px: 12
  min_bbox_height_px: 8
  min_bbox_margin_px: 15

model: #entree du transfo : [batch = 64, seq_len = 81, d_model = 256]
  encoder_hidden_dims: [256]
  d_model: 256 
  num_layers: 2 #nb de bloc transfo empilés. Un bloc = self attention, feedforward, add&norm, etc.
  num_heads: 4 # nb de tete d'attention en parrallèle, avec 4 têtes, chacune travaille sur 256/4=64 dimensions. 
  dim_feedforward: 512 #dim du MLP interne (ou Feed Forward Network) de chaque bloc transfo. Ce MLP sert à transformer l'info issu de la self attention vers quelque chose de plus riche (non linéarité).
  dropout: 0.1
  activation: gelu
  positional_encoding: learned
  max_window_size: 201
  norm_first: true #on normalise les activations avant de faire les calculs d'attention. Plus stable. 
  head_hidden_dims: [128] #taille du MLP final qui converti le latent en root

optimizer:
  lr: 0.00016788303
  weight_decay: 0.00032000921 #penalisation, (adam w : le weight decay est en dehors de l'optimisateur, contrairement à adam classique) pour éviter les poids trop grands et favoriser la généralisation.

training:
  batch_size: 64
  epochs: 60
  num_workers: 2
  group_batches_by_sequence: true
  grad_clip_norm: 1.0
  early_stopping_patience: 10

loss_weights:
  root: 1.0
  root_axis_weights: [1.0, 1.0, 1.7]
  root_vel: 0.10003676
  root_acc: 0.019068171
  cam3d: 0.3
  proj: 0.0

eval:
  splits: [valid, test]
  batch_size: 64
  num_workers: 2
  save_predictions_npz: true
  save_predictions_csv: true
  aggregate_overlaps: mean

plots:
  enabled: true
  split_for_plots: valid
  root_error_ground_vs_air_histogram: true
  seq_name: null
  person_idx: null
  num_frames_overlay: 6
  show_sam2d_overlay: false
  num_players_per_subplot: null
diagnostic_plots:
  enabled: true
  split_for_plots: valid
  root_error_vs_camera_distance: true
  root_error_vs_image_center_distance: true
  root_error_vs_player_speed: true
  speed_window: 5
