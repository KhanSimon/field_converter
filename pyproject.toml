[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "field-converter"
version = "0.1.0"
description = "Geometry-initialized temporal residual refinement for world-grounded player pose estimation from soccer broadcasts."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "Simon Khan" },
  { name = "Laurent Gajny" },
  { name = "Jennyfer Lecompte" },
  { name = "Sébastien Laporte" },
]
dependencies = [
  "matplotlib==3.11.0",
  "numpy==2.4.4",
  "PyYAML==6.0.3",
  "torch==2.6.0",
  "tqdm==4.68.3",
]

[project.urls]
Repository = "https://github.com/KhanSimon/field_converter"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["field_converter*"]
namespaces = false
